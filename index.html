<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 오픈 채팅방</title>
    <!-- Firebase SDK 로드 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .chat-container { background-color: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 400px; display: flex; flex-direction: column; height: 500px; }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; }
        #chat-box { flex-grow: 1; border: 1px solid #ddd; border-radius: 10px; overflow-y: scroll; padding: 10px; margin-bottom: 15px; background: #fafafa; display: flex; flex-direction: column; gap: 8px; }
        .message-item { background: #e1f5fe; padding: 8px 12px; border-radius: 10px; max-width: 80%; word-break: break-all; }
        .message-item b { color: #0288d1; display: block; font-size: 0.85em; margin-bottom: 2px; }
        .input-area { display: flex; gap: 8px; }
        input { flex-grow: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
        input:focus { border-color: #3498db; }
        button { padding: 12px 20px; background-color: #3498db; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        #name-box { margin-bottom: 10px; display: flex; gap: 8px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>실시간 채팅방</h2>
        
        <!-- 닉네임 설정 영역 -->
        <div id="name-box">
            <input type="text" id="username-input" placeholder="사용할 닉네임 입력..." maxlength="10">
            <button onclick="saveName()" style="background-color: #27ae60;">확정</button>
        </div>

        <!-- 대화 내용이 표시되는 박스 -->
        <div id="chat-box"></div>
        
        <!-- 메시지 입력 영역 -->
        <div class="input-area">
            <input type="text" id="message-input" placeholder="메시지를 입력하세요..." disabled onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="send-btn" onclick="sendMessage()" disabled>전송</button>
        </div>
    </div>

    <script>
        // 본인의 Firebase 프로젝트 설정으로 변경하세요!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myName = "";

        // 욕설 및 비속어 필터 리스트
        const badWords = ["시발", "병신", "새끼", "지랄", "꺼져", "존나", "tlqkf", "씨발", "개새끼"];

        function saveName() {
            const nameInput = document.getElementById('username-input');
            const name = nameInput.value.trim();
            if (!name) {
                alert("닉네임을 입력해주세요!");
                return;
            }
            myName = name;
            nameInput.disabled = true;
            event.target.disabled = true;
            
            // 채팅 입력창 활성화
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('message-input').focus();
        }

        // 욕설 필터링 함수
        function filterText(text) {
            let filtered = text;
            badWords.forEach(bad => {
                const regex = new RegExp(bad, 'gi');
                filtered = filtered.replace(regex, "***");
            });
            return filtered;
        }

        // 메시지 전송
        function sendMessage() {
            const input = document.getElementById('message-input');
            let text = input.value.trim();
            if (!text || !myName) return;

            // 욕설 필터링 적용
            text = filterText(text);

            db.collection("public_chats").add({
                name: myName,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = "";
            });
        }

        // 실시간 채팅 수신 (Firestore 실시간 리스너)
        db.collection("public_chats").orderBy("timestamp", "asc").onSnapshot((snapshot) => {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.text) {
                    const div = document.createElement('div');
                    div.className = "message-item";
                    div.innerHTML = `<b>${data.name}</b>${data.text}`;
                    chatBox.appendChild(div);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });
        });
    </script>
</body>
</html>
